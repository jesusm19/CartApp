
    <div class="card mb-3">
        <div class="card-body">
        <h5 class="card-title">{{ product.name }}</h5>
        <p class="card-text">{{ product.description }}</p>
        <p class="card-text"><strong>Price: {{ product.price }}</strong></p>
        <button 
            class="btn btn-primary"
            (click)="addCart(product)">
            Add to Cart</button>
        </div>
    </div>
