<div class="mb-4">

  <table class="table table-hover table-striped">
    <thead>
        <th>Producto</th>
        <th>Precio</th>
        <th>Cantidad</th>
        <th>Total</th>
        <th>Eliminar</th>
    </thead>
    <tbody>
      @for (item of listItems; track $index){
          <tr>
            <td>{{ item.product.name }}</td>
            <td>{{ item.product.price | currency }}</td>
            <td>{{ item.quantity }}</td>
            <td>{{ item.quantity * item.product.price | currency }}</td>
            <td>
              <button class="btn btn-danger btn-sm" (click)="onRemoveFromCart(item.product.id)">
                <i class="bi-trash"> Eliminar</i>
              </button>
            </td>
          </tr>

      }
    </tbody>
    <tfoot>
      <tr>
        <td colspan="4" class="text-end"><strong>Total:</strong></td>
        <td colspan="1" class="text-start"><strong>{{ total | currency }}</strong></td>
      </tr>
    </tfoot>

    </table>

</div>
